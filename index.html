/* AUDIO */
let AC=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,t='sine',v=0.12,s=0){
if(!AC)return;
try{
const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
o.type=t;o.frequency.setValueAtTime(f,t0);
if(s)o.frequency.exponentialRampToValueAtTime(Math.max(20,Math.abs(s)),t0+d);
g.gain.setValueAtTime(v,t0);
g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
o.connect(g);g.connect(AC.destination);
o.start(t0);o.stop(t0+d+0.02);
}catch(e){}
}
function noise(d,v=0.2,cut=1500){
if(!AC)return;
try{
const n=Math.max(1,AC.sampleRate*d|0),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
const s=AC.createBufferSource();s.buffer=b;
const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;
const g=AC.createGain();
g.gain.setValueAtTime(v,AC.currentTime);
g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
s.connect(f);f.connect(g);g.connect(AC.destination);
s.start();s.stop(AC.currentTime+d+0.02);
}catch(e){}
}

const B=[];
function addB(x,y,w,h,n,t,c){B.push({x,y,w,h,n,t,c});}
function hitsB(x,y,r){
for(let i=0;i<B.length;i++){
const b=B[i];
const nx=x<b.x?b.x:(x>b.x+b.w?b.x+b.w:x);
const ny=y<b.y?b.y:(y>b.y+b.h?b.y+b.h:y);
const dx=x-nx,dy=y-ny;
if(dx*dx+dy*dy<r*r)return b;
}
return null;
}
function distToB(px,py,b){
const nx=clamp(px,b.x,b.x+b.w),ny=clamp(py,b.y,b.y+b.h);
return Math.hypot(px-nx,py-ny);
}
function nearestB(px,py,r){
let bst=null,bd=r;
for(const b of B){
const d=distToB(px,py,b);
if(d<bd){bd=d;bst=b;}
}
return bst;
}

function tp(t){return{x:t.clientX,y:t.clientY};}
function ts(e){
e.preventDefault();initAudio();
for(const t of e.changedTouches){
const p=tp(t);
let hb=false;
for(const k in BTN){
const b=BTN[k];
if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.35){
hb=true;
if(k==='E')interact();
else if(k==='W')switchWpn();

if(!sAm)sAm={id:t.identifier,sx:p.x,sy:p.y,x:p.x,y:p.y};
}
}
}

e.preventDefault();

if(sAm&&t.identifier===sAm.id){sAm.x=p.x;sAm.y=p.y;}
}
}
function te(e){
e.preventDefault();
for(const t of e.changedTouches){
if(sMv&&t.identifier===sMv.id)sMv=null;
if(sAm&&t.identifier===sAm.id)sAm=null;
}
}

}
if(K['w']||K['arrowup'])ky=-1;
if(K['s']||K['arrowdown'])ky=1;
if(K['a']||K['arrowleft'])kx=-1;
if(K['d']||K['arrowright'])kx=1;
const fwd=ky;
h.spd+=fwd*400*dt;
h.spd*=Math.pow(.97,dt*60);
h.spd=clamp(h.spd,-200,400);
const st=kx;
h.a+=st*dt*1.5;
h.x+=Math.cos(h.a)*h.spd*dt;
h.y+=Math.sin(h.a)*h.spd*dt;
h.x=clamp(h.x,60,WW-60);
h.y=clamp(h.y,60,WH-60);
h.alt=Math.max(20,h.alt+((K[' ']||K['r'])?-30:20)*dt);
P.x=h.x;P.y=h.y;P.a=h.a;
continue;
}
if(h.wanted){
const dp=dist(h.x,h.y,P.x,P.y);
const wantA=Math.atan2(P.y-h.y,P.x-h.x);
h.a+=angDiff(wantA,h.a)*Math.min(1,dt*2);
if(dp>200){h.spd=180;h.x+=Math.cos(h.a)*h.spd*dt;h.y+=Math.sin(h.a)*h.spd*dt;}
else{h.spd*=.95;}
h.fireCd-=dt;
h.missileCd-=dt;
if(h.fireCd<=0&&dp<500){
h.fireCd=.15;
for(let i=0;i<2;i++)mkBul(h.x+Math.cos(h.a)*40,h.y+Math.sin(h.a)*40,
h.a+rnd(-.08,.08),900,18,'cop');
}
if(h.missileCd<=0&&dp<700){
h.missileCd=3;
mkBul(h.x+Math.cos(h.a)*40,h.y+Math.sin(h.a)*40,h.a,500,80,'cop',true);
}
}else{
h.spd*=.95;
}
}
}
function updBoats(dt){
for(const b of boats){
if(b===P.inBoat){
let kx=0,ky=0;
if(sMv){
const dx=sMv.x-sMv.sx,dy=sMv.y-sMv.sy,d=Math.hypot(dx,dy);
if(d>10){const k=Math.min(1,d/56);kx=dx/Math.max(d,1)*k;ky=dy/Math.max(d,1)*k;}
}
if(K['w']||K['arrowup'])ky=-1;
if(K['s']||K['arrowdown'])ky=1;
if(K['a']||K['arrowleft'])kx=-1;
if(K['d']||K['arrowright'])kx=1;
const fwd=kx*Math.cos(b.a)+ky*Math.sin(b.a);
b.spd+=fwd*300*dt;
b.spd*=Math.pow(.96,dt*60);
b.spd=clamp(b.spd,-100,300);
const st=kx*Math.cos(b.a+Math.PI/2)+ky*Math.sin(b.a+Math.PI/2);
if(Math.abs(b.spd)>5)b.a+=st*dt*1.8;
b.x+=Math.cos(b.a)*b.spd*dt;
b.y+=Math.sin(b.a)*b.spd*dt;
b.x=clamp(b.x,60,WW-60);
b.y=clamp(b.y,60,WH-60);
P.x=b.x;P.y=b.y;P.a=b.a;
continue;
}
b.spd*=.95;
}
}

function updWtd(dt){
if(S.wtd>0){
S.wtdT-=dt;
if(S.wtdT<=0)S.wtd=Math.max(0,S.wtd-dt*.28);
}
let near=false;

if(S.wtd>0&&!near){
S.hidT+=dt;
if(S.hidT>6){
S.wtd=Math.max(0,S.wtd-dt*.5);
S.hidT=0;
if(S.wtd===0&&S.cds===5)ach('es');
}
}else if(near)S.hidT=0;
S.cds=Math.ceil(S.wtd);
const tier=Math.max(1,Math.ceil(S.wtd));
const want=Math.min(12,Math.floor(S.wtd*2.4));
const wantHeli=S.wtd>=4;
const wantHeliCount=Math.floor((S.wtd-3.5)*2);
S.cdsMax=want;
S.cdsT-=dt;
if(cops.filter(c=>c.alive).length<want&&S.cdsT<=0&&S.wtd>0){
S.cdsT=1.3;
const c=spawnCop(tier);
if(c)cops.push(c);
}
const activeHelis=helis.filter(h=>h.wanted).length;
if(wantHeli&&activeHelis<wantHeliCount){
for(let i=0;i<50;i++){
const a=rnd(0,Math.PI*2),d=rnd(600,900);
const x=clamp(P.x+Math.cos(a)*d,100,WW-100);
const y=clamp(P.y+Math.sin(a)*d,100,WH-100);
helis.push({x,y,a:0,r:42,spd:0,alt:60,occ:false,hp:150,color:'#1b3a6b',wanted:true,fireCd:0,missileCd:2});
break;
}
}
if(S.wtd<=0){
for(let i=cops.length-1;i>=0;i--){
if(!cops[i].alive){cops.splice(i,1);continue;}
if(dist(cops[i].x,cops[i].y,P.x,P.y)>1400)cops.splice(i,1);
}
for(let i=helis.length-1;i>=0;i--){
if(helis[i].wanted)helis.splice(i,1);
}
}
}

/* ==================== 地图开关 ==================== */
let mapOpen=false;
function openMap(){mapOpen=!mapOpen;}

/* ==================== 昼夜 / 天气 ==================== */
function updDN(dt){
S.t+=dt;
S.dn=(S.dn+dt/180)%1;
S.wxt-=dt;
if(S.wxt<=0){
S.wx=S.wx==='clear'?'rain':'clear';
S.wxt=S.wx==='rain'?rnd(30,55):rnd(50,100);
toast(S.wx==='rain'?'☔ 开始下雨了':'☀ 雨停了');
}
}
function nightDark(){
const c=(Math.cos(S.dn*Math.PI*2)+1)/2;
return clamp(0.72-c*0.62,0,0.72);
}

/* ==================== 相机 ==================== */
const cam={x:0,y:0,shake:0};
function updCam(dt){
const t=P.inc||P.inHeli||P.inBoat||P;
let tx=t.x-W/2,ty=t.y-H/2;
if(WW<=W)tx=(WW-W)/2;else tx=clamp(tx,0,WW-W);
if(WH<=H)ty=(WH-H)/2;else ty=clamp(ty,0,WH-H);
const k=Math.min(1,dt*7);
cam.x=lerp(cam.x,tx,k);
cam.y=lerp(cam.y,ty,k);
if(cam.shake>0)cam.shake=Math.max(0,cam.shake-dt*26);
}

/* ==================== 玩家更新 ==================== */
function updPl(dt){
if(!P.alive)return;
let mx=0,my=0;
if(K['w']||K['arrowup'])my-=1;
if(K['s']||K['arrowdown'])my+=1;
if(K['a']||K['arrowleft'])mx-=1;
if(K['d']||K['arrowright'])mx+=1;
if(sMv){
const dx=sMv.x-sMv.sx,dy=sMv.y-sMv.sy,d=Math.hypot(dx,dy);
if(d>8){const k=Math.min(1,d/58);mx+=dx/d*k;my+=dy/d*k;}
}
const ml=Math.hypot(mx,my);
if(ml>1){mx/=ml;my/=ml;}
let ax=0,ay=0,fire=false;
if(sAm){
const dx=sAm.x-sAm.sx,dy=sAm.y-sAm.sy,d=Math.hypot(dx,dy);
if(d>10){ax=dx/d;ay=dy/d;if(d>28)fire=true;}
}
if(mDn){
const wx=mX+cam.x,wy=mY+cam.y;
const dx=wx-P.x,dy=wy-P.y,d=Math.hypot(dx,dy)||1;
ax=dx/d;ay=dy/d;fire=true;
}
if(K[' '])fire=true;
if(P.inc||P.inHeli||P.inBoat){
if(fire&&(ax||ay)){
P.a=Math.atan2(ay,ax);
const w=WPNS[wIdx];
if(P.fc<=0&&w.id!=='fist'&&w.ammo>0){
P.fc=w.rt;
for(let i=0;i<(w.bl||1);i++){
mkBul(P.x+Math.cos(P.a)*26,P.y+Math.sin(P.a)*26,
P.a+rnd(-w.sp,w.sp),w.spd,w.dmg,'pl',w.rocket);
}
addMuz(P.x+Math.cos(P.a)*30,P.y+Math.sin(P.a)*30,P.a);
if(w.sfx)SFX[w.sfx]();
S.wtd=Math.min(5,S.wtd+0.05);S.wtdT=12;
w.ammo--;
}
}
P.fc=Math.max(0,P.fc-dt);
return;
}
if(ml>0.05){
const spd=P.spd*(ml>0.75?1:0.62);
const moved=mvEnt(P,mx*spd*dt,my*spd*dt);
if(moved)P.wp+=dt*13*ml;
if(!fire)P.a=Math.atan2(my,mx);
}else P.wp*=0.9;
if(fire&&(ax||ay)){
P.a=Math.atan2(ay,ax);
const w=WPNS[wIdx];
if(w.auto)tryFire();
else if(!P.firePressed)tryFire();
P.firePressed=true;
P.fc=Math.max(0,P.fc-dt);
}else{
P.firePressed=false;
P.fc=Math.max(0,P.fc-dt);
}
if(P.killStreakT>0){P.killStreakT-=dt;if(P.killStreakT<=0)P.killStreak=0;}
}

function render(){
X.fillStyle='#0a0f14';
X.fillRect(0,0,W,H);
const sx=cam.shake>0?rnd(-cam.shake,cam.shake):0;
const sy=cam.shake>0?rnd(-cam.shake,cam.shake):0;
X.save();
X.translate(-Math.round(cam.x)+sx,-Math.round(cam.y)+sy);
const x0=cam.x-100,y0=cam.y-100,x1=cam.x+W+100,y1=cam.y+H+100;
drawGround(x0,y0,x1,y1);
drawZones(x0,y0,x1,y1);
drawSea();
drawRoads(x0,y0,x1,y1);
drawRail();
drawDecals();
drawBuildings(x0,y0,x1,y1);
drawMetro();
drawMissionMark();
drawCorpses(x0,y0,x1,y1);
drawCars(x0,y0,x1,y1);
drawHelis(x0,y0,x1,y1);
drawBoats(x0,y0,x1,y1);
drawTrain();
drawEntities(x0,y0,x1,y1);
drawBullets();
drawParticles();
drawExplosions();
drawFloats();
drawLights(x0,y0,x1,y1);
X.restore();
if(S.wx==='rain')drawRain();
const dark=nightDark();
if(dark>0.02){
X.fillStyle=`rgba(6,10,20,${dark*0.75})`;
X.fillRect(0,0,W,H);
}
drawHUD();
if(!mapOpen)drawMinimap();
else drawFullMap();
drawControls();
drawSticks();
}
function drawGround(x0,y0,x1,y1){
X.fillStyle='#16261a';
X.fillRect(x0,y0,x1-x0,y1-y0);
X.fillStyle='rgba(255,255,255,0.012)';
const gs=120;
const gx0=Math.floor(x0/gs)*gs,gy0=Math.floor(y0/gs)*gs;
for(let x=gx0;x<x1;x+=gs)
for(let y=gy0;y<y1;y+=gs)
if(((x/gs)+(y/gs))%2===0)X.fillRect(x,y,gs,gs);
}
function drawZones(x0,y0,x1,y1){
for(const z of ZONES){
if(z.x>x1||z.y>y1||z.x+z.w<x0||z.y+z.h<y0)continue;
X.fillStyle=z.c;
X.fillRect(z.x,z.y,z.w,z.h);
}
}
function drawSea(){
X.fillStyle='#0a3a5a';
X.fillRect(SEA.x,SEA.y,SEA.w,SEA.h);
X.strokeStyle='rgba(100,200,255,0.12)';
X.lineWidth=2;
const t=performance.now()*0.001;
for(let i=0;i<8;i++){
const y=SEA.y+i*180+Math.sin(t+i)*10;
X.beginPath();
X.moveTo(SEA.x,y);
for(let x=SEA.x;x<SEA.x+SEA.w;x+=40)
X.lineTo(x,y+Math.sin(t*2+x*0.02+i)*6);
X.stroke();
}
}
function drawRoads(x0,y0,x1,y1){

for(const x of RX){
X.fillRect(x-RH-6,y0,6,y1-y0);
X.fillRect(x+RH,y0,6,y1-y0);

function drawStick(s,rc,dc){
const dx=s.x-s.sx,dy=s.y-s.sy,d=Math.hypot(dx,dy);
const mr=56,k=d>mr?mr/d:1;
const nx=dx*k,ny=dy*k;
X.beginPath();X.arc(s.sx,s.sy,mr,0,Math.PI*2);
X.fillStyle=rc;X.fill();
X.strokeStyle=dc;X.lineWidth=2;X.stroke();
X.beginPath();X.arc(s.sx+nx,s.sy+ny,24,0,Math.PI*2);
X.fillStyle=dc;X.fill();
}
function getHint(){
if(P.inc)return'下车';
if(P.inHeli)return'下机';
if(P.inBoat)return'下船';
for(const c of cars)if(!c.occ&&dist(c.x,c.y,P.x,P.y)<78)return'上车';
for(const h of helis)if(!h.occ&&dist(h.x,h.y,P.x,P.y)<120)return'上机';
for(const b of boats)if(!b.occ&&dist(b.x,b.y,P.x,P.y)<100)return'上船';
for(const m of METRO)if(dist(m.x,m.y,P.x,P.y)<80)return'地铁';
const b=nearestB(P.x,P.y,85);
if(b)return b.n;
return null;
}

/* ==================== 主循环 ==================== */
let lastT=performance.now(),running=false;
function upd(dt){
updPl(dt);
updCars(dt);
updHelis(dt);
updBoats(dt);
updTrain(dt);
for(const n of npcs)updCiv(n,dt);
for(const c of cops)updCop(c,dt);
for(const g of gang)updGang(g,dt);
updBul(dt);
updPar(dt);
updWtd(dt);
updMis();
updDN(dt);
updCam(dt);
if(S.money>=5000)ach('rc');
if(S.money>=20000)ach('rich');
if(Math.random()<0.005){
for(let i=npcs.length-1;i>=0;i--)if(!npcs[i].alive&&dist(npcs[i].x,npcs[i].y,P.x,P.y)>1600)npcs.splice(i,1);
for(let i=cops.length-1;i>=0;i--)if(!cops[i].alive&&dist(cops[i].x,cops[i].y,P.x,P.y)>1600)cops.splice(i,1);
for(let i=gang.length-1;i>=0;i--)if(!gang[i].alive&&dist(gang[i].x,gang[i].y,P.x,P.y)>1600)gang.splice(i,1);
}
}
function loop(now){
const dt=Math.min(0.045,(now-lastT)/1000);
lastT=now;
if(running){upd(dt);render();}
requestAnimationFrame(loop);
}

startMis(0);

});
